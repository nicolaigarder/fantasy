<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fyntasy League</title>
<meta name="description" content="Stilling, pointudvikling og bødekasse for vores FPL Draft-liga">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --up: #006300;
  --down: #d03b3b;
  --fine-30: #d03b3b;
  --fine-20: #ec835a;
  --good: #0ca30c;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --up: #0ca30c; --down: #e66767; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --up: #0ca30c; --down: #e66767; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); margin-top: 4px; font-size: 14px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); vertical-align: middle; margin-left: 6px; }
.badge.live { background: color-mix(in srgb, var(--down) 15%, transparent); color: var(--down); }
.theme-btn { background: var(--surface); color: var(--ink-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 44%), 1fr)); gap: 12px; margin-bottom: 16px; }
.tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.tile { padding: 14px 16px; }
.tile .k { color: var(--ink-2); font-size: 13px; }
.tile .v { font-size: 26px; font-weight: 650; margin-top: 2px; line-height: 1.2; }
.tile .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card { padding: 18px 18px 14px; margin-bottom: 16px; }
.card h2 { font-size: 17px; margin: 0 0 2px; }
.card .hint { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
th:first-child, td:first-child { text-align: left; }
tbody tr:last-child td { border-bottom: 0; }
td.name { text-align: left; }
.who { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.who b { font-weight: 600; }
.who small { display: block; color: var(--muted); font-size: 12px; }
.rank { font-weight: 650; width: 34px; }
.mv { font-size: 12px; margin-left: 4px; }
.mv.up { color: var(--up); } .mv.down { color: var(--down); } .mv.same { color: var(--muted); }
.total { font-weight: 650; }
.owe { color: var(--down); font-weight: 600; }
.ok { color: var(--up); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 3px 2px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.legend button[aria-pressed="false"] { opacity: 0.4; }
.legend i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .endlabel { font-size: 12px; font-weight: 600; fill: var(--ink-2); }
.chart .series path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; transition: opacity .15s; }
.chart .series circle { stroke: var(--surface); stroke-width: 2; }
.chart .dim { opacity: 0.15; }
.chart .cross { stroke: var(--axis); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,.12); border-radius: 10px; padding: 8px 10px; font-size: 13px; min-width: 150px; opacity: 0; transition: opacity .1s; z-index: 2; }
.tip .t { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tip .r i { width: 10px; height: 2px; border-radius: 2px; flex: none; }
.tip .r span { color: var(--ink-2); flex: 1; }
.tip .r b { font-variant-numeric: tabular-nums; }
.gw td { padding: 7px 10px; }
.gw td.cell { min-width: 70px; }
.gw .top { font-weight: 700; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; margin-left: 6px; color: #fff; }
.chip.c30 { background: var(--fine-30); }
.chip.c20 { background: var(--fine-20); color: #0b0b0b; }
.chip.unpaid { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.chip.c30.unpaid { color: var(--fine-30); }
.chip.c20.unpaid { color: var(--fine-20); }
.keyrow { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 12px; margin-top: 10px; }
.keyrow .chip { margin: 0 4px 0 0; }
footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
footer a { color: inherit; }
.err { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--down); }
@media (max-width: 560px) {
  h1 { font-size: 23px; }
  .tile .v { font-size: 22px; }
  th, td { padding: 8px 6px; }
  .hide-sm { display: none; }
  .tile { padding: 12px; }
  .who small { font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .who .real { display: none; }
  .gw th:first-child, .gw td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Fantasy</h1>
      <div class="sub" id="subtitle">Henter data…</div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Skift lyst/mørkt tema">◐ Tema</button>
  </header>

  <main id="app">
    <section class="tiles" id="tiles"></section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Stilling</h2>
          <p class="hint" id="standHint"></p>
        </div>
      </div>
      <div class="scroll"><table id="standings"></table></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Pointudvikling</h2>
          <p class="hint" id="chartHint">Samlet point efter hver gameweek</p>
        </div>
        <div class="seg" role="group" aria-label="Vælg visning" id="modes">
          <button type="button" data-mode="total" aria-pressed="true">Samlet</button>
          <button type="button" data-mode="gap" aria-pressed="false">Bag førende</button>
          <button type="button" data-mode="rank" aria-pressed="false">Placering</button>
          <button type="button" data-mode="gw" aria-pressed="false">Pr. GW</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>Gameweeks &amp; bøder</h2>
          <p class="hint" id="fineHint"></p>
        </div>
      </div>
      <div class="scroll"><table class="gw" id="gwTable"></table></div>
      <div class="keyrow" id="fineKey"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</div>

<script>
(() => {
  // ---------- tema ----------
  const root = document.documentElement;
  try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    if (state.ready) drawChart();
  });

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const SVG = "http://www.w3.org/2000/svg";
  const sv = (tag, attrs = {}) => { const n = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };
  const fmtKr = (n, cur) => `${n.toLocaleString("da-DK")} ${cur}`;
  const cssVar = (name) => getComputedStyle(root).getPropertyValue(name).trim();

  const state = { ready: false, mode: "total", hidden: new Set(), focus: null };

  async function load() {
    const bust = `?t=${Date.now()}`;
    const [cfg, data, pay] = await Promise.all([
      fetch("config.json" + bust).then((r) => r.json()),
      fetch("data/league.json" + bust).then((r) => r.json()),
      fetch("data/payments.json" + bust).then((r) => r.ok ? r.json() : {}).catch(() => ({})),
    ]);
    return { cfg, data, pay };
  }

  function model({ cfg, data, pay }) {
    const nick = cfg.nicknames || {};
    const fines = Object.assign({ lowest: 30, second_lowest: 20, currency: "kr" }, cfg.fines || {});
    // faste farver pr. person – følger personen, aldrig placeringen
    const order = Object.keys(nick).length ? Object.keys(nick).map(Number) : data.entries.map((e) => e.entry_id).sort((a, b) => a - b);
    const players = data.entries.map((e) => {
      const idx = Math.max(0, order.indexOf(e.entry_id));
      const name = nick[e.entry_id] || e.first;
      const hist = {};
      for (const h of data.history[e.entry_id] || []) hist[h.event] = h;
      const paid = new Set((pay[name] || []).map(Number));
      return { ...e, name, color: `var(--s${(idx % 8) + 1})`, colorVar: `--s${(idx % 8) + 1}`, idx, hist, paid };
    }).sort((a, b) => a.idx - b.idx);

    const events = data.events.map((e) => e.id).filter((gw) => players.some((p) => p.hist[gw]));
    const finished = new Set(data.events.filter((e) => e.finished).map((e) => e.id));

    // bøder – samme regel som i Excel: alle med laveste score betaler 30.
    // Er der kun én med laveste, betaler den/de med næstlaveste 20.
    const fineBy = {}; // gw -> {entry_id: kr}
    for (const gw of events) {
      if (!finished.has(gw)) continue;
      const scores = players.map((p) => p.hist[gw]?.points);
      if (scores.some((s) => s == null)) continue;
      const min = Math.min(...scores);
      const nMin = scores.filter((s) => s === min).length;
      const second = nMin === 1 ? Math.min(...scores.filter((s) => s !== min)) : null;
      fineBy[gw] = {};
      players.forEach((p, i) => {
        if (scores[i] === min) fineBy[gw][p.entry_id] = fines.lowest;
        else if (second != null && scores[i] === second) fineBy[gw][p.entry_id] = fines.second_lowest;
      });
    }
    for (const p of players) {
      p.owed = 0; p.paidKr = 0;
      for (const gw of Object.keys(fineBy)) {
        const f = fineBy[gw][p.entry_id] || 0;
        p.owed += f;
        if (f && p.paid.has(Number(gw))) p.paidKr += f;
      }
      p.missing = p.owed - p.paidKr;
    }

    // placering pr. GW ud fra samlede point
    const rankBy = {};
    for (const gw of events) {
      const tots = players.map((p) => ({ id: p.entry_id, t: p.hist[gw]?.total ?? 0 }));
      rankBy[gw] = {};
      for (const a of tots) rankBy[gw][a.id] = 1 + tots.filter((b) => b.t > a.t).length;
    }

    const byLeagueEntry = Object.fromEntries(players.map((p) => [p.id, p]));
    const standings = (data.standings || []).map((s) => ({ ...s, p: byLeagueEntry[s.league_entry] })).filter((s) => s.p);
    return { cfg, data, fines, players, events, finished, fineBy, rankBy, standings };
  }

  // ---------- header + tiles ----------
  function renderTop(m) {
    const { data, players, standings, fines, events, finished } = m;
    document.title = data.league.name;
    $("title").textContent = data.league.name;
    const cur = data.current_event;
    const live = !data.current_event_finished;
    const upd = new Date(data.updated);
    const sub = $("subtitle");
    sub.textContent = `FPL Draft · Gameweek ${cur} `;
    sub.append(el("span", { class: "badge" + (live ? " live" : ""), text: live ? "I gang" : "Afsluttet" }));
    sub.append(document.createTextNode(` · Data fra ${upd.toLocaleString("da-DK", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`));

    const tiles = $("tiles"); tiles.replaceChildren();
    const lead = standings[0], second = standings[1];
    if (lead) tiles.append(tile("Førende", `${lead.p.name}`, `${lead.total} point${second ? ` · ${lead.total - second.total} foran ${second.p.name}` : ""}`));

    const lastDone = [...events].reverse().find((gw) => finished.has(gw));
    if (lastDone) {
      const pts = players.map((p) => p.hist[lastDone]?.points ?? 0);
      const best = Math.max(...pts);
      const winners = players.filter((p, i) => pts[i] === best).map((p) => p.name).join(" & ");
      tiles.append(tile(`Ugens bedste · GW ${lastDone}`, winners, `${best} point`));
    }
    const owed = players.reduce((a, p) => a + p.owed, 0);
    const paid = players.reduce((a, p) => a + p.paidKr, 0);
    tiles.append(tile("Fællesbox indsamlet", fmtKr(paid, fines.currency), `af ${fmtKr(owed, fines.currency)} i alt`));
    const debtors = players.filter((p) => p.missing > 0);
    tiles.append(tile("Mangler at betale", fmtKr(owed - paid, fines.currency), debtors.length ? debtors.map((p) => `${p.name} ${p.missing}`).join(" · ") : "Alle har betalt 🎉"));
  }
  const tile = (k, v, d) => el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: "d", text: d }));

  // ---------- stilling ----------
  function renderStandings(m) {
    const { standings, fines, data } = m;
    const t = $("standings"); t.replaceChildren();
    const lead = standings[0]?.total ?? 0;
    t.append(el("thead", {}, el("tr", {},
      el("th", { text: "#" }), el("th", { text: "Spiller", style: "text-align:left" }),
      el("th", { class: "hide-sm", text: `GW ${data.current_event}` }), el("th", { text: "Total" }),
      el("th", { text: "Bag", class: "hide-sm" }),
      el("th", { text: "Bøder", class: "hide-sm" }), el("th", { text: "Betalt", class: "hide-sm" }), el("th", { text: "Mangler" }))));
    const tb = el("tbody");
    for (const s of standings) {
      const p = s.p;
      const diff = (s.last_rank || s.rank) - s.rank;
      const mv = diff > 0 ? el("span", { class: "mv up", text: `▲${diff}`, title: `Op ${diff} plads(er)` })
        : diff < 0 ? el("span", { class: "mv down", text: `▼${-diff}`, title: `Ned ${-diff} plads(er)` })
        : el("span", { class: "mv same", text: "–", title: "Uændret" });
      tb.append(el("tr", {},
        el("td", { class: "rank" }, String(s.rank), mv),
        el("td", { class: "name" }, el("div", { class: "who" },
          el("span", { class: "dot", style: `background:${p.color}` }),
          el("div", {}, el("b", { text: p.name }), el("small", {}, p.team, el("span", { class: "real", text: ` · ${p.first} ${p.last}` }))))),
        el("td", { class: "hide-sm", text: s.event_total }),
        el("td", { class: "total", text: s.total }),
        el("td", { class: "hide-sm", text: s.total === lead ? "–" : `−${lead - s.total}` }),
        el("td", { class: "hide-sm", text: fmtKr(p.owed, fines.currency) }),
        el("td", { class: "hide-sm", text: fmtKr(p.paidKr, fines.currency) }),
        el("td", { class: p.missing > 0 ? "owe" : "ok", text: p.missing > 0 ? fmtKr(p.missing, fines.currency) : "✓ 0" })));
    }
    t.append(tb);
    $("standHint").textContent = "Pilene viser ændring siden sidste gameweek. Bøder tæller kun afsluttede gameweeks.";
  }

  // ---------- graf ----------
  const MODES = {
    total: { hint: "Samlet point efter hver gameweek", val: (m, p, gw) => p.hist[gw]?.total, tipSort: -1 },
    gap: { hint: "Point efter den førende efter hver gameweek (0 = i front)", val: (m, p, gw) => {
      const best = Math.max(...m.players.map((q) => q.hist[gw]?.total ?? 0)); return p.hist[gw] ? p.hist[gw].total - best : null; }, tipSort: -1 },
    rank: { hint: "Placering i ligaen efter hver gameweek", val: (m, p, gw) => m.rankBy[gw]?.[p.entry_id], tipSort: 1, invert: true },
    gw: { hint: "Point scoret i den enkelte gameweek", val: (m, p, gw) => p.hist[gw]?.points, tipSort: -1 },
  };

  function niceTicks(lo, hi, count = 5) {
    const span = hi - lo || 1;
    const step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((s) => span / s <= count) || 10 * mag;
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
    for (let v = a; v <= b + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
    return out;
  }

  let M; // model
  function renderLegend() {
    const lg = $("legend"); lg.replaceChildren();
    for (const p of M.players) {
      const b = el("button", { type: "button", "aria-pressed": String(!state.hidden.has(p.entry_id)), title: "Klik for at vise/skjule" },
        el("i", { style: `background:${p.color}` }), p.name);
      b.addEventListener("click", () => {
        state.hidden.has(p.entry_id) ? state.hidden.delete(p.entry_id) : state.hidden.add(p.entry_id);
        if (state.hidden.size === M.players.length) state.hidden.delete(p.entry_id);
        renderLegend(); drawChart();
      });
      b.addEventListener("mouseenter", () => { state.focus = p.entry_id; applyFocus(); });
      b.addEventListener("mouseleave", () => { state.focus = null; applyFocus(); });
      lg.append(b);
    }
  }

  function applyFocus() {
    document.querySelectorAll("#chart .series").forEach((g) => {
      g.classList.toggle("dim", state.focus != null && Number(g.dataset.id) !== state.focus);
    });
  }

  function drawChart() {
    const host = $("chart"), tip = $("tip");
    host.querySelector("svg")?.remove();
    const mode = MODES[state.mode];
    $("chartHint").textContent = mode.hint;
    const W = Math.max(320, host.clientWidth), H = W < 560 ? 300 : 380;
    const mg = { l: 40, r: 64, t: 12, b: 30 };
    const iw = W - mg.l - mg.r, ih = H - mg.t - mg.b;
    const evs = M.events;
    const shown = M.players.filter((p) => !state.hidden.has(p.entry_id));
    const series = shown.map((p) => ({ p, pts: evs.map((gw) => ({ gw, v: mode.val(M, p, gw) })).filter((d) => d.v != null) }));

    // domæner
    const xs = (gw) => mg.l + (evs.length <= 1 ? iw / 2 : ((gw - evs[0]) / (evs[evs.length - 1] - evs[0])) * iw);
    let lo, hi, ticks;
    if (state.mode === "rank") {
      lo = 1; hi = M.players.length; ticks = Array.from({ length: hi }, (_, i) => i + 1);
    } else {
      const all = series.flatMap((s) => s.pts.map((d) => d.v));
      lo = Math.min(0, ...all); hi = Math.max(0, ...all);
      if (state.mode === "gw") lo = 0;
      ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length - 1];
    }
    const ys = (v) => mode.invert ? mg.t + ((v - lo) / (hi - lo || 1)) * ih : mg.t + ih - ((v - lo) / (hi - lo || 1)) * ih;

    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Linjediagram: ${mode.hint}` });
    // grid + y-akse
    for (const t of ticks) {
      svg.append(sv("line", { x1: mg.l, x2: mg.l + iw, y1: ys(t), y2: ys(t), class: t === 0 && state.mode !== "rank" ? "baseline" : "gridline" }));
      const lab = sv("text", { x: mg.l - 8, y: ys(t) + 4, "text-anchor": "end", class: "tick" }); lab.textContent = state.mode === "rank" ? `${t}.` : t; svg.append(lab);
    }
    // x-akse
    const every = Math.ceil(evs.length / Math.max(2, Math.floor(iw / 44)));
    evs.forEach((gw, i) => {
      const isLast = i === evs.length - 1;
      if (i % every !== 0 && !(isLast && (i % every) >= every / 2 + 0.5)) return;
      const lab = sv("text", { x: xs(gw), y: H - 8, "text-anchor": "middle", class: "tick" }); lab.textContent = `GW${gw}`; svg.append(lab);
    });

    // linjer
    for (const s of series) {
      const g = sv("g", { class: "series", "data-id": s.p.entry_id });
      const d = s.pts.map((pt, i) => `${i ? "L" : "M"}${xs(pt.gw).toFixed(1)},${ys(pt.v).toFixed(1)}`).join("");
      g.append(sv("path", { d, stroke: s.p.color }));
      const last = s.pts[s.pts.length - 1];
      if (last) g.append(sv("circle", { cx: xs(last.gw), cy: ys(last.v), r: 4, fill: s.p.color }));
      svg.append(g);
    }
    // direkte labels i højre side, skubbet fra hinanden
    const labs = series.filter((s) => s.pts.length).map((s) => { const l = s.pts[s.pts.length - 1]; return { s, y: ys(l.v), v: l.v }; }).sort((a, b) => a.y - b.y);
    const gap = 14;
    for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < gap) labs[i].y = labs[i - 1].y + gap;
    const over = labs.length ? labs[labs.length - 1].y - (mg.t + ih) : 0;
    if (over > 0) { labs.forEach((l) => (l.y -= over)); for (let i = labs.length - 2; i >= 0; i--) if (labs[i + 1].y - labs[i].y < gap) labs[i].y = labs[i + 1].y - gap; }
    for (const l of labs) {
      const g = sv("g", { class: "series", "data-id": l.s.p.entry_id });
      const t = sv("text", { x: mg.l + iw + 10, y: l.y + 4, class: "endlabel" }); t.textContent = l.s.p.name; g.append(t);
      svg.append(g);
    }

    // crosshair + tooltip
    const cross = sv("line", { y1: mg.t, y2: mg.t + ih, class: "cross", visibility: "hidden" });
    const marks = sv("g");
    svg.append(cross, marks);
    const hit = sv("rect", { x: mg.l - 10, y: 0, width: iw + 20, height: H, fill: "transparent", tabindex: 0 });
    svg.append(hit);
    host.append(svg);

    let curIdx = null;
    const show = (idx) => {
      curIdx = Math.max(0, Math.min(evs.length - 1, idx));
      const gw = evs[curIdx], x = xs(gw);
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
      marks.replaceChildren();
      const rows = series.map((s) => ({ s, v: mode.val(M, s.p, gw) })).filter((r) => r.v != null);
      rows.sort((a, b) => (mode.tipSort < 0 ? b.v - a.v : a.v - b.v));
      for (const r of rows) marks.append(sv("circle", { cx: x, cy: ys(r.v), r: 4, fill: r.s.p.color, stroke: cssVar("--surface"), "stroke-width": 2 }));
      tip.replaceChildren(el("div", { class: "t", text: `Gameweek ${gw}${M.finished.has(gw) ? "" : " · i gang"}` }));
      for (const r of rows) {
        const val = state.mode === "rank" ? `${r.v}.` : state.mode === "gap" ? (r.v === 0 ? "Førende" : `${r.v}`) : `${r.v}`;
        tip.append(el("div", { class: "r" }, el("i", { style: `background:${r.s.p.color}` }), el("span", { text: r.s.p.name }), el("b", { text: val })));
      }
      tip.style.opacity = 1;
      const scale = host.clientWidth / W;
      const tw = tip.offsetWidth;
      let left = x * scale + 14; if (left + tw > host.clientWidth) left = x * scale - tw - 14;
      tip.style.left = `${Math.max(0, left)}px`; tip.style.top = `${mg.t * scale}px`;
    };
    const hide = () => { cross.setAttribute("visibility", "hidden"); marks.replaceChildren(); tip.style.opacity = 0; curIdx = null; };
    const fromEvent = (e) => {
      const r = svg.getBoundingClientRect(); const x = ((e.clientX - r.left) / r.width) * W;
      let best = 0, bd = Infinity; evs.forEach((gw, i) => { const d = Math.abs(xs(gw) - x); if (d < bd) { bd = d; best = i; } });
      show(best);
    };
    hit.addEventListener("pointermove", fromEvent);
    hit.addEventListener("pointerdown", fromEvent);
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("focus", () => show(evs.length - 1));
    hit.addEventListener("blur", hide);
    hit.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { show((curIdx ?? evs.length) - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { show((curIdx ?? -1) + 1); e.preventDefault(); }
    });
    applyFocus();
  }

  // ---------- gameweek-tabel ----------
  function renderGwTable(m) {
    const { players, events, fineBy, fines, finished } = m;
    const t = $("gwTable"); t.replaceChildren();
    const hr = el("tr", {}, el("th", { text: "GW" }));
    for (const p of players) hr.append(el("th", {}, el("span", { class: "dot", style: `background:${p.color};display:inline-block;margin-right:6px;vertical-align:-1px` }), p.name));
    t.append(el("thead", {}, hr));
    const tb = el("tbody");
    for (const gw of [...events].reverse()) {
      const tr = el("tr", {}, el("td", {}, `GW ${gw}`, finished.has(gw) ? null : el("span", { class: "badge live", text: "live" })));
      const pts = players.map((p) => p.hist[gw]?.points);
      const best = Math.max(...pts.filter((x) => x != null));
      players.forEach((p, i) => {
        const v = pts[i];
        const td = el("td", { class: "cell" + (v === best && finished.has(gw) ? " top" : "") });
        td.append(v == null ? "–" : String(v));
        const f = fineBy[gw]?.[p.entry_id];
        if (f) {
          const isPaid = p.paid.has(gw);
          td.append(el("span", { class: `chip ${f === fines.lowest ? "c30" : "c20"}${isPaid ? "" : " unpaid"}`, title: `${f} ${fines.currency} – ${isPaid ? "betalt" : "ikke betalt"}`, text: `${f}${isPaid ? " ✓" : " !"}` }));
        }
        tr.append(td);
      });
      tb.append(tr);
    }
    // total-række
    const tot = el("tr", {}, el("td", {}, el("b", { text: "Total" })));
    for (const p of players) {
      const last = p.hist[events[events.length - 1]];
      tot.append(el("td", {}, el("b", { text: last ? last.total : "–" })));
    }
    tb.append(tot);
    t.append(tb);
    $("fineHint").textContent = `Laveste score i en gameweek giver ${fines.lowest} ${fines.currency}, næstlaveste ${fines.second_lowest} ${fines.currency}. Fed = ugens højeste.`;
    $("fineKey").replaceChildren(
      el("span", {}, el("span", { class: "chip c30", text: `${fines.lowest} ✓` }), "betalt"),
      el("span", {}, el("span", { class: "chip c30 unpaid", text: `${fines.lowest} !` }), "ikke betalt"),
      el("span", {}, el("span", { class: "chip c20", text: `${fines.second_lowest} ✓` }), "næstlaveste"),
    );
  }

  function renderFooter(m) {
    const f = $("footer"); f.replaceChildren();
    f.append("Data hentes automatisk fra ",
      el("a", { href: `https://draft.premierleague.com/league`, target: "_blank", rel: "noopener", text: "FPL Draft" }),
      ` (liga ${m.data.league.id}) hver time. Betalinger registreres i data/payments.json.`);
  }

  load().then((raw) => {
    M = model(raw);
    renderTop(M); renderStandings(M); renderLegend(); renderGwTable(M); renderFooter(M);
    state.ready = true; drawChart();
    let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawChart, 120); });
    $("modes").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-mode]"); if (!b) return;
      state.mode = b.dataset.mode;
      $("modes").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      drawChart();
    });
  }).catch((err) => {
    $("app").replaceChildren(el("div", { class: "err", text: "Kunne ikke hente data: " + err.message }));
    $("subtitle").textContent = "";
  });
})();
</script>
</body>
</html>
